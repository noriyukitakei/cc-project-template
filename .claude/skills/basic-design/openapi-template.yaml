openapi: 3.0.3
info:
  title: [システム名] API
  description: [システムの概要説明]
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: ローカル開発環境
  - url: https://[本番ドメイン]
    description: 本番環境

paths:
  /api/v1/[resource]:
    get:
      summary: [リソース一覧取得]
      description: [APIの詳細説明]
      parameters:
        - name: [パラメータ名]
          in: query  # query / path / header
          required: false
          description: [パラメータの説明]
          schema:
            type: string
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/[ResourceName]'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: [リソース作成]
      description: [APIの詳細説明]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/[ResourceName]CreateRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/[ResourceName]'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/[resource]/{id}:
    get:
      summary: [リソース取得]
      description: [APIの詳細説明]
      parameters:
        - name: id
          in: path
          required: true
          description: リソースID
          schema:
            type: integer
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/[ResourceName]'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: [リソース更新]
      description: [APIの詳細説明]
      parameters:
        - name: id
          in: path
          required: true
          description: リソースID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/[ResourceName]UpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/[ResourceName]'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: [リソース削除]
      description: [APIの詳細説明]
      parameters:
        - name: id
          in: path
          required: true
          description: リソースID
          schema:
            type: integer
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    [ResourceName]:
      type: object
      properties:
        id:
          type: integer
          description: ID
        [フィールド名]:
          type: string
          description: [説明]
        created_at:
          type: string
          format: date-time
          description: 作成日時
        updated_at:
          type: string
          format: date-time
          description: 更新日時

    [ResourceName]CreateRequest:
      type: object
      required:
        - [必須フィールド名]
      properties:
        [フィールド名]:
          type: string
          description: [説明]

    [ResourceName]UpdateRequest:
      type: object
      properties:
        [フィールド名]:
          type: string
          description: [説明]

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: エラーコード
        message:
          type: string
          description: エラーメッセージ

  responses:
    BadRequest:
      description: リクエスト不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: リソースが存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
